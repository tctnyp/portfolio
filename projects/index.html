<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects</title>
    <link rel="stylesheet" href="./index.css">
</head>

<body>
    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="../index/">Home</a></li>
            <li><a href="../about/">About Me</a></li>
            <li><a href="./">Projects</a></li>
            <li><a href="../contact/">Contact</a></li>
        </ul>
    </nav>

    <main class="page-shell">
        <section class="page-card">
            <p class="page-eyebrow">Work</p>
            <h1 class="page-title">Projects</h1>
            <p class="page-copy">A selection of projects and experiments. Click any card to view details.</p>

            <div id="projects-grid" class="page-grid projects-grid"></div>

            <!-- Modal -->
            <div id="project-modal" class="modal" aria-hidden="true">
                <div class="modal-backdrop"></div>
                <div class="modal-panel" role="dialog" aria-modal="true">
                    <button class="modal-close" aria-label="Close">✕</button>
                    <div class="modal-banner"><img src="../Files/Images/placeholder.png" alt="Project banner"></div>
                    <div class="modal-content">
                        <h2 class="modal-title">Project Title</h2>
                        <p class="modal-subtitle">Project type</p>
                        <p class="modal-desc">Longer project description goes here.</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="../script.js"></script>
    <script type="module" src="./index.js"></script>
</body>

</html>
