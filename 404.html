<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 | Page Not Found</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        h1 {
            font-size: 120px;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            color: #cbd5e1;
            margin-bottom: 35px;
        }

        .button {
            display: inline-block;
            padding: 14px 28px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 999px;
            transition: background 0.2s ease;
        }

        .button:hover {
            background: #3b82f6;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>404</h1>
        <h2>Page Not Found</h2>

        <p>
            The page you are looking for doesn't exist or has been moved.
        </p>

        <a href="index.html" class="button">Return Home</a>
    </div>

</body>

</html>
